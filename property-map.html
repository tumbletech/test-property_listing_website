<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Ribidu — Property Map</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Bootstrap Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet"
  >

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >


  <!-- Ribidu Styles -->
  <link
    rel="stylesheet"
    href="./css/style.css"
  >

  <style>

    body {
      background: #f6f8f7;
    }

    .map-navbar {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
    }

    .map-brand {
      font-size: 1.5rem;
      font-weight: 700;
      color: #198754;
      text-decoration: none;
    }

    .map-page {
      padding: 25px;
    }

    .map-header {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .map-container {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    #propertyMap {
      width: 100%;
      height: 650px;
    }

    .map-controls {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .property-popup {
      min-width: 220px;
    }

    .property-popup-title {
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 5px;
    }

    .property-popup-location {
      color: #6c757d;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }

    .property-popup-price {
      color: #198754;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .map-disclaimer {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px 15px;
      margin-top: 15px;
      color: #6c757d;
      font-size: 0.85rem;
    }

    @media (max-width: 768px) {

      .map-page {
        padding: 15px;
      }

      #propertyMap {
        height: 550px;
      }

    }

  </style>

</head>

<body>


<!-- =========================================================
     NAVBAR
========================================================= -->

<nav class="navbar map-navbar">

  <div class="container-fluid px-4">

    <a
      href="./index.html"
      class="map-brand"
    >
      Ribidu
    </a>

    <div class="d-flex align-items-center gap-2">

      <a
        href="./index.html"
        class="btn btn-outline-success btn-sm"
      >
        <i class="bi bi-house me-1"></i>
        Browse Properties
      </a>

      <a
        href="./agentdashboardlogin.html"
        class="btn btn-success btn-sm"
      >
        Agent Login
      </a>

    </div>

  </div>

</nav>


<!-- =========================================================
     PAGE
========================================================= -->

<main class="map-page">

  <div class="container-fluid">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="map-header">

      <div class="d-flex flex-column flex-md-row justify-content-between gap-3">

        <div>

          <h1 class="h3 fw-bold mb-1">
            Property Map
          </h1>

          <p class="text-muted mb-0">
            Explore available properties listed on Ribidu.
          </p>

        </div>

        <div class="text-md-end">

          <span class="badge bg-success">
            <i class="bi bi-geo-alt me-1"></i>
            Ribidu Listings
          </span>

        </div>

      </div>

    </div>


    <!-- =====================================================
         SEARCH CONTROLS
    ====================================================== -->

    <div class="map-controls">

      <div class="row g-3 align-items-end">


        <!-- SEARCH -->

        <div class="col-lg-5">

          <label
            for="locationSearch"
            class="form-label fw-semibold"
          >
            Search Location
          </label>

          <div class="input-group">

            <input
              type="text"
              id="locationSearch"
              class="form-control"
              placeholder="e.g. General Trias, Cavite"
            >

            <button
              id="searchLocationBtn"
              class="btn btn-success"
              type="button"
            >
              <i class="bi bi-search"></i>
            </button>

          </div>

        </div>


        <!-- PROPERTY TYPE -->

        <div class="col-md-4 col-lg-2">

          <label
            for="propertyTypeFilter"
            class="form-label fw-semibold"
          >
            Property Type
          </label>

          <select
            id="propertyTypeFilter"
            class="form-select"
          >

            <option value="all">
              All Types
            </option>

            <option value="House">
              House
            </option>

            <option value="Condominium">
              Condominium
            </option>

            <option value="Commercial">
              Commercial
            </option>

            <option value="Warehouse">
              Warehouse
            </option>

            <option value="Lot">
              Lot
            </option>

            <option value="Farm">
              Farm
            </option>

            <option value="Apartment">
              Apartment
            </option>

          </select>

        </div>


        <!-- TRANSACTION -->

        <div class="col-md-4 col-lg-2">

          <label
            for="transactionFilter"
            class="form-label fw-semibold"
          >
            Transaction
          </label>

          <select
            id="transactionFilter"
            class="form-select"
          >

            <option value="all">
              All
            </option>

            <option value="For Sale">
              For Sale
            </option>

            <option value="For Rent">
              For Rent
            </option>

          </select>

        </div>


        <!-- RADIUS -->

        <div class="col-md-4 col-lg-2">

          <label
            for="radiusFilter"
            class="form-label fw-semibold"
          >
            Radius
          </label>

          <select
            id="radiusFilter"
            class="form-select"
          >

            <option value="5">
              5 km
            </option>

            <option value="10">
              10 km
            </option>

            <option value="25">
              25 km
            </option>

            <option value="50">
              50 km
            </option>

            <option value="100">
              100 km
            </option>

          </select>

        </div>


        <!-- RESET -->

        <div class="col-md-12 col-lg-1">

          <button
            id="resetMapBtn"
            class="btn btn-light border w-100"
            type="button"
            title="Reset map"
          >

            <i class="bi bi-arrow-counterclockwise"></i>

          </button>

        </div>


      </div>

    </div>


    <!-- =====================================================
         MAP
    ====================================================== -->

    <div class="map-container">

      <div id="propertyMap"></div>

    </div>


    <!-- =====================================================
         DISCLAIMER
    ====================================================== -->

    <div class="map-disclaimer">

      <i class="bi bi-info-circle me-1"></i>

      <strong>Map Disclaimer:</strong>

      The properties shown on the map are limited to those
      registered with or listed on Ribidu.

    </div>


  </div>

</main>


<!-- =========================================================
     LEAFLET
========================================================= -->

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<!-- =========================================================
     MAP JAVASCRIPT
========================================================= -->

<script>

  /* ---------------------------------------------------------
     SAMPLE PROPERTY DATA
  --------------------------------------------------------- */

  let properties = [];
  let markers = [];



  /* ---------------------------------------------------------
     MAP INITIALIZATION
  --------------------------------------------------------- */

  const map =
    L.map("propertyMap").setView(
      [14.35, 120.95],
      11
    );


  /* ---------------------------------------------------------
     OPENSTREETMAP
  --------------------------------------------------------- */

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }
  ).addTo(map);


  /* ---------------------------------------------------------
     MARKERS
  --------------------------------------------------------- */

  function formatPrice(price) {

    return "₱" +
      Number(price).toLocaleString(
        "en-PH"
      );

  }


  function createPopup(property) {

    return `

        <div class="property-popup">

            <div class="property-popup-title">
                ${property.title}
            </div>

            <div class="property-popup-location">
                <i class="bi bi-geo-alt"></i>
                ${property.address}
            </div>

            <div class="mb-2">

                <span class="badge bg-light text-dark border">
                    ${property.type}
                </span>

                <span class="badge bg-success">
                    ${property.transaction}
                </span>

            </div>

            <div class="property-popup-price">
                ₱${Number(property.price).toLocaleString("en-PH")}
            </div>

            <a
                href="./index.html"
                class="btn btn-sm btn-success w-100"
            >
                View Property
            </a>

        </div>

    `;

}

  async function loadPropertiesFromCSV() {

    try {

        const response =
            await fetch("./assets/spsheet/ribidu-propertydb.csv");

        console.log(
            "CSV response:",
            response.status,
            response.ok
        );

        const csvText =
            await response.text();

        console.log(
            "CSV contents:",
            csvText
        );

        properties =
            parseCSV(csvText);

        console.log(
            "Parsed properties:",
            properties
        );

        displayProperties(properties);


    } catch (error) {

        console.error(
            "CSV loading error:",
            error
        );

    }

}

  function displayProperties(list) {

    markers.forEach(
        function(marker) {
            map.removeLayer(marker);
        }
    );

    markers = [];

    list.forEach(
        function(property) {

            console.log(
                "Adding marker:",
                property.title,
                property.latitude,
                property.longitude
            );

            const marker =
                L.marker([
                    property.latitude,
                    property.longitude
                ]).addTo(map);

            marker.bindPopup(
                createPopup(property)
            );

            markers.push(marker);

        }
    );

}

  /* ---------------------------------------------------------
     FILTER
  --------------------------------------------------------- */

  function applyFilters() {

    const type =
      document.getElementById(
        "propertyTypeFilter"
      ).value;


    const transaction =
      document.getElementById(
        "transactionFilter"
      ).value;


    let filtered =
      properties.filter(
        function(property) {

          const typeMatch =
            type === "all" ||
            property.type === type;

          const transactionMatch =
            transaction === "all" ||
            property.transaction === transaction;

          return (
            typeMatch &&
            transactionMatch
          );

        }
      );


    displayProperties(filtered);

  }


  document
    .getElementById(
      "propertyTypeFilter"
    )
    .addEventListener(
      "change",
      applyFilters
    );


  document
    .getElementById(
      "transactionFilter"
    )
    .addEventListener(
      "change",
      applyFilters
    );


  /* ---------------------------------------------------------
     LOCATION SEARCH
  --------------------------------------------------------- */

  document
    .getElementById(
      "searchLocationBtn"
    )
    .addEventListener(
      "click",
      function() {

        const query =
          document
            .getElementById(
              "locationSearch"
            )
            .value
            .trim()
            .toLowerCase();


        if (!query) {
          return;
        }


        const matchingProperties =
          properties.filter(
            function(property) {

              return property.location
                .toLowerCase()
                .includes(query);

            }
          );


        if (
          matchingProperties.length === 0
        ) {

          alert(
            "No Ribidu properties were found for that location."
          );

          return;

        }


        displayProperties(
          matchingProperties
        );


        const first =
          matchingProperties[0];


        map.setView(
          [
            first.latitude,
            first.longitude
          ],
          13
        );

      }
    );


  /* ---------------------------------------------------------
     ENTER KEY SEARCH
  --------------------------------------------------------- */

  document
    .getElementById(
      "locationSearch"
    )
    .addEventListener(
      "keypress",
      function(event) {

        if (event.key === "Enter") {

          document
            .getElementById(
              "searchLocationBtn"
            )
            .click();

        }

      }
    );


  /* ---------------------------------------------------------
     RESET MAP
  --------------------------------------------------------- */

  document
    .getElementById(
      "resetMapBtn"
    )
    .addEventListener(
      "click",
      function() {

        document
          .getElementById(
            "locationSearch"
          )
          .value = "";


        document
          .getElementById(
            "propertyTypeFilter"
          )
          .value = "all";


        document
          .getElementById(
            "transactionFilter"
          )
          .value = "all";


        displayProperties(
          properties
        );


        map.setView(
          [14.35, 120.95],
          11
        );

      }
    );

    
/* ---------------------------------------------------------
   CSV PARSER
--------------------------------------------------------- */

function parseCSV(csvText) {

    const rows = [];
    let row = [];
    let field = "";
    let insideQuotes = false;

    for (let i = 0; i < csvText.length; i++) {

        const char = csvText[i];
        const nextChar = csvText[i + 1];

        if (char === '"') {

            if (insideQuotes && nextChar === '"') {

                field += '"';
                i++;

            } else {

                insideQuotes = !insideQuotes;

            }

        }

        else if (char === "," && !insideQuotes) {

            row.push(field);
            field = "";

        }

        else if (
            (char === "\n" || char === "\r") &&
            !insideQuotes
        ) {

            if (char === "\r" && nextChar === "\n") {
                i++;
            }

            row.push(field);
            field = "";

            if (
                row.some(
                    value => value.trim() !== ""
                )
            ) {
                rows.push(row);
            }

            row = [];

        }

        else {

            field += char;

        }

    }

    if (
        field !== "" ||
        row.length > 0
    ) {

        row.push(field);

        if (
            row.some(
                value => value.trim() !== ""
            )
        ) {
            rows.push(row);
        }

    }

    const headers =
        rows[0].map(
            header => header.trim()
        );

    return rows
        .slice(1)
        .map(values => {

            const property = {};

            headers.forEach(
                (header, index) => {

                    property[header] =
                        values[index]
                            ? values[index].trim()
                            : "";

                }
            );

            // Normalize Ribidu fields

            property.title =
                property.Title;

            property.address =
                property["Full Address"];

            property.type =
                property.Type;

            property.transaction =
                property.Transaction;

            property.price =
                parseFloat(
                    String(property.Price)
                        .replace(/,/g, "")
                ) || 0;

            property.latitude =
                parseFloat(
                    property.latitude
                );

            property.longitude =
                parseFloat(
                    property.longitude
                );

            return property;

        })
        .filter(
            property =>
                Number.isFinite(
                    property.latitude
                ) &&
                Number.isFinite(
                    property.longitude
                )
        );

}


/* ---------------------------------------------------------
   LOAD RIBIDU PROPERTY DATABASE
--------------------------------------------------------- */

loadPropertiesFromCSV();


/* ---------------------------------------------------------
   LOAD RIBIDU PROPERTY DATABASE
--------------------------------------------------------- */

loadPropertiesFromCSV();



</script>


</body>

</html>
